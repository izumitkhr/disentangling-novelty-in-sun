[project]
name = "disentangling-novelty-in-sun-prepare"
version = "0.1.0"
description = "Inputs of the analyses: Materials Project download and MACE-OMAT-0 single points"
requires-python = "==3.12.*"
# Versions that produced the inputs of the paper (recorded in the manifest.json
# of each output). pymatgen differs from the analysis environment (../pyproject.toml).
dependencies = [
    "mp-api==0.46.5",
    "pymatgen==2026.5.4",
    "monty==2026.7.16",
    "numpy==2.5.3",
]

[dependency-groups]
# MACE single points (CUDA GPU recommended)
mlip = [
    "ase==3.29.0",
    "mace-torch==0.3.16",
    "torch==2.14.0",
]

[tool.uv]
package = false
